name: Checks and preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.13
      - run: make check
      - run: make preview
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: french-geography
          path: |
            dist/french-geography.apkg
            build/preview/
