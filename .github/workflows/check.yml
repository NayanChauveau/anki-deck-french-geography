name: CI
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.13
      - uses: actions/cache@v4
        with:
          path: build/media
          key: maps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'src/french_geography/**', 'geo/**', 'cards/**', 'assets/fonts/**') }}
          restore-keys: |
            maps-${{ runner.os }}-${{ runner.arch }}-
      - run: make check
      - run: make preview
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: french-geography
          path: |
            dist/french-geography-en.apkg
            dist/french-geography-fr.apkg
            build/preview/
      - uses: actions/checkout@v4
        with:
          repository: NayanChauveau/anki-deckdock
          ref: 34c797fa8f6546ece8aa0a7e31f90f745ef7a38e
          path: .compat/anki-deckdock
      - run: uv run --frozen python scripts/check_deckdock.py --deckdock .compat/anki-deckdock
  release:
    name: Publish versioned release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-versioned-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: french-geography
          path: release
      - name: Publish the next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish_release.py
          --package release/dist/french-geography-en.apkg
          --package release/dist/french-geography-fr.apkg
