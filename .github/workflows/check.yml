name: Checks and preview
"on":
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.13
      - run: make check
      - run: make preview
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: french-geography
          path: |
            dist/french-geography.apkg
            build/preview/
      - uses: actions/checkout@v4
        with:
          repository: NayanChauveau/anki-deckdock
          ref: 34c797fa8f6546ece8aa0a7e31f90f745ef7a38e
          path: .compat/anki-deckdock
      - run: uv run --frozen python scripts/check_deckdock.py --deckdock .compat/anki-deckdock
