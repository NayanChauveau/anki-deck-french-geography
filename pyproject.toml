[project]
name = "french-geography-anki"
version = "0.1.0"
description = "Cartes Anki de géographie physique française"
requires-python = ">=3.12"
dependencies = ["genanki>=0.13.1", "pydantic>=2.9", "pyyaml>=6.0.2", "shapely>=2.1", "pyproj>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
french-geography = "french_geography.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/french_geography"]

[tool.ruff]
extend-exclude = [".compat"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-v --durations=10"
faulthandler_timeout = 120
testpaths = ["tests"]
pythonpath = ["src", "."]
