explanations:
  landforms.morvan.context: 'Au nord-est du Massif central, en Bourgogne, entre les bassins de la Seine,
    de la Loire et de la Saône. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.chaine-des-puys.context: 'Alignement volcanique au nord des monts Dore, à l’ouest de Clermont-Ferrand
    et de la Limagne. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.monts-dore.context: 'Massif volcanique au sud-ouest de Clermont-Ferrand ; le puy de Sancy en
    est le point culminant. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.cantal.context: 'Massif volcanique autour du Plomb du Cantal et du puy Mary, au nord-est d’Aurillac.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.forez.context: 'À l’est de la vallée de la Dore et à l’ouest de la plaine du Forez, parcourue
    par la Loire. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.livradois.context: 'Entre les vallées de l’Allier à l’ouest et de la Dore à l’est ; les monts
    du Forez se trouvent au-delà de la Dore. Zone schématique : limites indicatives, sans valeur administrative
    ou géologique.'
  landforms.millevaches.context: 'Dans la montagne limousine, à l’ouest du Massif central ; la Vienne et
    la Vézère y prennent leur source. Zone schématique : limites indicatives, sans valeur administrative
    ou géologique.'
  landforms.aubrac.context: 'Plateau du sud du Massif central, entre les vallées du Lot, de la Truyère et
    de la Colagne. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.cevennes.context: 'Sur la bordure sud-est du Massif central, entre la Lozère, le Gard et l’Ardèche.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.lyonnais.context: 'À l’ouest de Lyon et à l’est de la plaine du Forez ; le Beaujolais est au
    nord et le Pilat au sud. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.beaujolais.context: 'Au nord-ouest de Lyon, à l’ouest de la vallée de la Saône et au nord des
    monts du Lyonnais. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.pilat.context: 'À la bordure orientale du Massif central, au sud-est de Saint-Étienne et à l’ouest
    du Rhône. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.vercors.context: 'Massif préalpin au sud-ouest de Grenoble, entre les vallées de l’Isère et
    de la Drôme. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.chartreuse.context: 'Entre Grenoble au sud et Chambéry au nord, à l’ouest de la vallée du Grésivaudan.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.bauges.context: 'Entre Chambéry, Annecy et Albertville, au nord-est de la Chartreuse. Zone schématique
    : limites indicatives, sans valeur administrative ou géologique.'
  landforms.bornes.context: 'À l’est du lac d’Annecy et à l’ouest de la chaîne des Aravis. Ici, les Bornes
    sont distinguées des Aravis. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.aravis.context: 'Chaîne orientée nord-est–sud-ouest, à l’est des Bornes et à l’ouest du val
    d’Arly. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.chablais.context: 'Préalpes au sud du Léman, au nord des Bornes et des Aravis. Seule la partie
    française est représentée. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.beaufortain.context: 'À l’est d’Albertville, au sud du massif du Mont-Blanc et au nord de la
    Tarentaise. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.belledonne.context: 'À l’est de Grenoble et du Grésivaudan, face à la Chartreuse, jusqu’aux
    abords de la Maurienne. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.ecrins.context: 'Massif de haute montagne entre la Romanche au nord, la Durance à l’est et le
    Drac à l’ouest. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.queyras.context: 'Autour du bassin du Guil, à l’est de la Durance, près de la frontière italienne.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.ventoux.context: 'Massif provençal au nord-est de Carpentras et à l’est du couloir rhodanien.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.luberon.context: 'Chaîne entre le Calavon au nord et la Durance au sud, de Cavaillon vers Manosque.
    Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.alpilles.context: 'Petite chaîne calcaire à l’est d’Arles, au sud de Saint-Rémy-de-Provence
    et au nord de la Crau. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.sainte-victoire.context: 'Chaîne calcaire à l’est d’Aix-en-Provence ; son point culminant est
    le pic des Mouches. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.sainte-baume.context: 'Chaîne calcaire à l’est d’Aubagne et au nord de Toulon, entre les Bouches-du-Rhône
    et le Var. Zone schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.maures.context: 'Dans le Var, entre Hyères et Fréjus, au sud de la dépression des Maures. Zone
    schématique : limites indicatives, sans valeur administrative ou géologique.'
  landforms.esterel.context: 'Massif aux roches volcaniques rouges, à l’est de Fréjus et Saint-Raphaël,
    en bordure de la Méditerranée. Zone schématique : limites indicatives, sans valeur administrative ou
    géologique.'
  parks.core_areas_notice: Seuls les cœurs terrestre et marin sont représentés, sans aire d’adhésion ni aire
    maritime adjacente. Contours de février 2026 simplifiés pour l’apprentissage ; ne pas utiliser pour vérifier
    la réglementation d’un lieu.
  overseas.position_notice: Point de situation à l’intérieur du territoire ; le planisphère montre sa position réelle.
  landforms.approximate_notice: 'Zone indicative de relief : les limites Natural Earth sont approximatives,
    sans valeur administrative.'
  landforms.schematic_notice: 'Zone schématique dessinée pour ce deck : elle situe le grand ensemble sans en
    délimiter précisément le contour. Ce n’est ni un zonage administratif ni une carte géologique.'
  river.loire.summary: Elle traverse notamment Orléans, Tours et Nantes avant de rejoindre l’Atlantique à Saint-Nazaire.
  river.seine.summary: Elle traverse Paris, puis Rouen, avant de rejoindre la Manche par l’estuaire de la Seine.
  river.rhone.summary: Il traverse le lac Léman, passe par Lyon, puis rejoint la mer Méditerranée par son delta
    en Camargue.
  river.ariege.summary: Elle rejoint la Garonne au sud de Toulouse.
  river.dordogne.summary: Elle rencontre la Garonne au bec d’Ambès ; leur estuaire commun est la Gironde.
  river.doubs.summary: Rivière du massif du Jura, il est un affluent de la Saône.
  river.durance.summary: Affluent du Rhône, elle draine une partie des Alpes du Sud.
  river.escaut.summary: Né en France, ce fleuve traverse la Belgique avant de rejoindre la mer du Nord par
    les Pays-Bas.
  river.garonne.summary: La Garonne et la Dordogne se rejoignent pour former l’estuaire de la Gironde.
  river.marne.summary: Affluent de la Seine, elle rejoint celle-ci à proximité de Paris.
  river.meuse.summary: Ce fleuve traverse la France, la Belgique et les Pays-Bas.
  river.moselle.summary: Elle appartient au bassin du Rhin, dont elle est un affluent.
  river.rhin.summary: Le Rhin rejoint la mer du Nord. Le tracé Natural Earth est complété par la portion frontalière
    disponible dans BD TOPAGE 2024 ; il ne représente pas tout le cours international.
  river.saone.summary: La Saône rejoint le Rhône à Lyon. Son tracé est issu de BD TOPAGE 2024.
  river.segre.summary: Il naît en Cerdagne française et rejoint l’Èbre.
  river.tarn.summary: Il naît au mont Lozère et rejoint la Garonne.
  river.vienne.summary: Elle naît sur le plateau de Millevaches et rejoint la Loire.
  river.yonne.summary: Issue du Morvan, elle rejoint la Seine à Montereau-Fault-Yonne.
  river.adour.summary: Il passe par Tarbes, Dax et Bayonne avant de rejoindre l’Atlantique.
  river.somme.summary: Elle passe par Amiens et Abbeville, puis rejoint la Manche. Le tracé inclut la Somme
    canalisée.
  river.vilaine.summary: Elle passe par Rennes et Redon avant son embouchure barrée à Arzal.
  river.charente.summary: Elle passe par Angoulême, Cognac, Saintes et Rochefort avant l’Atlantique.
  river.aude.summary: Elle traverse Carcassonne puis rejoint la Méditerranée.
  river.herault.summary: Il descend de l’Aigoual et rejoint la Méditerranée près d’Agde.
  river.var.summary: Il rejoint la Méditerranée dans le sud-est de la France.
  river.orne.summary: Ce fleuve normand passe par Caen avant son embouchure à Ouistreham.
  river.allier.summary: L’Allier rejoint directement la Loire.
  river.cher.summary: Le Cher rejoint directement la Loire.
  river.oise.summary: L’Oise rejoint la Seine à Conflans-Sainte-Honorine. Le tracé TOPAGE couvre la partie
    française disponible.
  river.lot.summary: Le Lot rejoint directement la Garonne.
  river.isere.summary: L’Isère rejoint le Rhône au nord de Valence.
  river.ain.summary: L’Ain descend du Jura et rejoint directement le Rhône.
  port.city-13055.context: Marseille-Fos dessert la façade méditerranéenne.
  port.city-76351.context: Le Havre se situe à l’entrée maritime de l’axe Seine, sur la Manche.
  port.city-76540.context: Rouen est un port de fond d’estuaire, relié à la Manche par la Seine.
  port.city-29019.context: Brest est une ville portuaire de la façade atlantique.
  port.city-17300.context: La Rochelle est un port de la façade atlantique.
  peak.puy-de-sancy.context: 'Grand ensemble de relief : Massif central.'
  peak.mont-blanc.context: 'Grand ensemble de relief : Alpes.'
  peak.cret-de-la-neige.context: 'Grand ensemble de relief : Jura.'
  peak.monte-cinto.context: 'Grand ensemble de relief : Reliefs corses.'
