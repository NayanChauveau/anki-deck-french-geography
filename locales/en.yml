explanations:
  landforms.morvan.context: 'In Burgundy, at the north-eastern end of the Massif Central, between the Seine,
    Loire and Saône basins. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.chaine-des-puys.context: 'A volcanic chain north of the Monts Dore, west of Clermont-Ferrand
    and the Limagne plain. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.monts-dore.context: 'A volcanic massif south-west of Clermont-Ferrand, whose highest point is
    the Puy de Sancy. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.cantal.context: 'A volcanic massif around the Plomb du Cantal and Puy Mary, north-east of Aurillac.
    Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.forez.context: 'East of the Dore valley and west of the Forez plain, through which the Loire
    flows. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.livradois.context: 'Between the Allier valley to the west and the Dore valley to the east; the
    Forez Mountains lie beyond the Dore. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.millevaches.context: 'In the Limousin uplands, in the western Massif Central; the Vienne and
    Vézère rise here. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.aubrac.context: 'A plateau in the southern Massif Central, between the Lot, Truyère and Colagne
    valleys. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.cevennes.context: 'Along the south-eastern edge of the Massif Central, across Lozère, Gard and
    Ardèche. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.lyonnais.context: 'West of Lyon and east of the Forez plain, with the Beaujolais to the north
    and the Pilat to the south. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.beaujolais.context: 'North-west of Lyon, west of the Saône valley and north of the Lyonnais
    Mountains. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.pilat.context: 'On the eastern edge of the Massif Central, south-east of Saint-Étienne and west
    of the Rhône. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.vercors.context: 'A pre-Alpine massif south-west of Grenoble, between the Isère and Drôme valleys.
    Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.chartreuse.context: 'Between Grenoble to the south and Chambéry to the north, west of the Grésivaudan
    valley. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.bauges.context: 'Between Chambéry, Annecy and Albertville, north-east of the Chartreuse. Schematic
    area: indicative boundaries, not administrative or geological limits.'
  landforms.bornes.context: 'East of Lake Annecy and west of the Aravis range. Here, the Bornes are shown
    separately from the Aravis. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.aravis.context: 'A north-east–south-west range, east of the Bornes and west of the Val d’Arly.
    Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.chablais.context: 'Pre-Alps south of Lake Geneva, north of the Bornes and Aravis. Only the French
    part is shown. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.beaufortain.context: 'East of Albertville, south of the Mont Blanc massif and north of the Tarentaise
    valley. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.belledonne.context: 'East of Grenoble and the Grésivaudan, facing the Chartreuse and extending
    towards the Maurienne valley. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.ecrins.context: 'A high mountain massif between the Romanche to the north, the Durance to the
    east and the Drac to the west. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.queyras.context: 'Around the Guil basin, east of the Durance, close to the Italian border. Schematic
    area: indicative boundaries, not administrative or geological limits.'
  landforms.ventoux.context: 'A Provençal massif north-east of Carpentras and east of the Rhône corridor.
    Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.luberon.context: 'A range between the Calavon to the north and the Durance to the south, from
    Cavaillon towards Manosque. Schematic area: indicative boundaries, not administrative or geological
    limits.'
  landforms.alpilles.context: 'A small limestone range east of Arles, south of Saint-Rémy-de-Provence and
    north of the Crau plain. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.sainte-victoire.context: 'A limestone range east of Aix-en-Provence, whose highest point is
    the Pic des Mouches. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.sainte-baume.context: 'A limestone range east of Aubagne and north of Toulon, across Bouches-du-Rhône
    and Var. Schematic area: indicative boundaries, not administrative or geological limits.'
  landforms.maures.context: 'In Var, between Hyères and Fréjus, south of the Maures depression. Schematic
    area: indicative boundaries, not administrative or geological limits.'
  landforms.esterel.context: 'A massif of red volcanic rocks east of Fréjus and Saint-Raphaël, on the Mediterranean
    coast. Schematic area: indicative boundaries, not administrative or geological limits.'
  river.loire.summary: It passes through Orléans, Tours and Nantes before reaching the Atlantic at Saint-Nazaire.
  river.seine.summary: It flows through Paris, then Rouen, before reaching the English Channel through the
    Seine estuary.
  river.rhone.summary: It flows through Lake Geneva and Lyon, then reaches the Mediterranean Sea through its
    delta in the Camargue.
  river.ariege.summary: It joins the Garonne south of Toulouse.
  river.dordogne.summary: It meets the Garonne at the Bec d’Ambès; their shared estuary is the Gironde.
  river.doubs.summary: A river in the Jura Mountains, it is a tributary of the Saône.
  river.durance.summary: A tributary of the Rhône, it drains part of the Southern Alps.
  river.escaut.summary: Rising in France, this river flows through Belgium before reaching the North Sea through
    the Netherlands.
  river.garonne.summary: The Garonne and the Dordogne meet to form the Gironde estuary.
  river.marne.summary: A tributary of the Seine, it joins that river near Paris.
  river.meuse.summary: This river flows through France, Belgium and the Netherlands.
  river.moselle.summary: It belongs to the Rhine basin and is a tributary of the Rhine.
  river.rhin.summary: The Rhine flows into the North Sea. The Natural Earth outline is supplemented by the
    available border section from BD TOPAGE 2024; it does not show the entire international course.
  river.saone.summary: The Saône joins the Rhône in Lyon. Its outline comes from BD TOPAGE 2024.
  river.segre.summary: It rises in French Cerdanya and joins the Ebro.
  river.tarn.summary: It rises on Mont Lozère and joins the Garonne.
  river.vienne.summary: It rises on the Plateau de Millevaches and joins the Loire.
  river.yonne.summary: Rising in the Morvan, it joins the Seine at Montereau-Fault-Yonne.
  river.adour.summary: It flows through Tarbes, Dax and Bayonne before reaching the Atlantic.
  river.somme.summary: It flows through Amiens and Abbeville, then reaches the English Channel. The outline
    includes the canalised Somme.
  river.vilaine.summary: It flows through Rennes and Redon before reaching its mouth, which is dammed at Arzal.
  river.charente.summary: It flows through Angoulême, Cognac, Saintes and Rochefort before reaching the Atlantic.
  river.aude.summary: It flows through Carcassonne and then reaches the Mediterranean Sea.
  river.herault.summary: It descends from Mont Aigoual and reaches the Mediterranean Sea near Agde.
  river.var.summary: It flows into the Mediterranean Sea in south-eastern France.
  river.orne.summary: This river in Normandy flows through Caen before reaching its mouth at Ouistreham.
  river.allier.summary: The Allier flows directly into the Loire.
  river.cher.summary: The Cher flows directly into the Loire.
  river.oise.summary: The Oise joins the Seine at Conflans-Sainte-Honorine. The TOPAGE outline covers the available
    French section.
  river.lot.summary: The Lot flows directly into the Garonne.
  river.isere.summary: The Isère joins the Rhône north of Valence.
  river.ain.summary: The Ain descends from the Jura Mountains and flows directly into the Rhône.
  landforms.approximate_notice: 'Indicative landform area: the Natural Earth boundaries are approximate and
    have no administrative status.'
  landforms.schematic_notice: 'A schematic area drawn for this deck: it locates the broad landform region without
    defining its precise boundary. It is neither an administrative zoning map nor a geological map.'
  peak.puy-de-sancy.context: 'Broad landform region: Massif Central.'
  peak.mont-blanc.context: 'Broad landform region: Alps.'
  peak.cret-de-la-neige.context: 'Broad landform region: Jura Mountains.'
  peak.monte-cinto.context: 'Broad landform region: Corsican mountains.'
  lakes.reservoir: An artificial reservoir.
  lakes.seasonal: A natural lake whose surface area varies seasonally; the TOPAGE outline is a geographic reference, not the current water level.
  lakes.natural: A natural lake.
  lakes.verdon_reservoir: A reservoir created by a dam on the Verdon.
  lakes.durance_reservoir: A reservoir created by a dam on the Durance.
  lakes.shared_france_switzerland: A lake shared by France and Switzerland.
  seas.boundary_notice: An indicative maritime area from Natural Earth; this outline is not a legal boundary.
  overseas.position_notice: A location point within the territory; the world map shows its actual position.
  port.city-13055.context: Marseille-Fos serves the Mediterranean coast.
  port.city-76351.context: Le Havre lies at the seaward entrance to the Seine corridor, on the English Channel.
  port.city-76540.context: Rouen is a port at the head of an estuary, linked to the English Channel by the
    Seine.
  port.city-29019.context: Brest is a port city on the Atlantic coast.
  port.city-17300.context: La Rochelle is a port on the Atlantic coast.
  parks.core_areas_notice: Only the terrestrial and marine core areas, where present, are shown; membership
    areas and adjacent marine areas are excluded. The February 2026 boundaries have been simplified for learning;
    do not use them to determine the regulations applicable to a location.
