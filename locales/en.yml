explanations:
  river.loire.summary: It passes through Orléans, Tours and Nantes before reaching the Atlantic at Saint-Nazaire.
  river.seine.summary: It flows through Paris, then Rouen, before reaching the English Channel through the
    Seine estuary.
  river.rhone.summary: It flows through Lake Geneva and Lyon, then reaches the Mediterranean Sea through its
    delta in the Camargue.
  river.ariege.summary: It joins the Garonne south of Toulouse.
  river.dordogne.summary: It meets the Garonne at the Bec d’Ambès; their shared estuary is the Gironde.
  river.doubs.summary: A river in the Jura Mountains, it is a tributary of the Saône.
  river.durance.summary: A tributary of the Rhône, it drains part of the Southern Alps.
  river.escaut.summary: Rising in France, this river flows through Belgium before reaching the North Sea through
    the Netherlands.
  river.garonne.summary: The Garonne and the Dordogne meet to form the Gironde estuary.
  river.marne.summary: A tributary of the Seine, it joins that river near Paris.
  river.meuse.summary: This river flows through France, Belgium and the Netherlands.
  river.moselle.summary: It belongs to the Rhine basin and is a tributary of the Rhine.
  river.rhin.summary: The Rhine flows into the North Sea. The Natural Earth outline is supplemented by the
    available border section from BD TOPAGE 2024; it does not show the entire international course.
  river.saone.summary: The Saône joins the Rhône in Lyon. Its outline comes from BD TOPAGE 2024.
  river.segre.summary: It rises in French Cerdanya and joins the Ebro.
  river.tarn.summary: It rises on Mont Lozère and joins the Garonne.
  river.vienne.summary: It rises on the Plateau de Millevaches and joins the Loire.
  river.yonne.summary: Rising in the Morvan, it joins the Seine at Montereau-Fault-Yonne.
  river.adour.summary: It flows through Tarbes, Dax and Bayonne before reaching the Atlantic.
  river.somme.summary: It flows through Amiens and Abbeville, then reaches the English Channel. The outline
    includes the canalised Somme.
  river.vilaine.summary: It flows through Rennes and Redon before reaching its mouth, which is dammed at Arzal.
  river.charente.summary: It flows through Angoulême, Cognac, Saintes and Rochefort before reaching the Atlantic.
  river.aude.summary: It flows through Carcassonne and then reaches the Mediterranean Sea.
  river.herault.summary: It descends from Mont Aigoual and reaches the Mediterranean Sea near Agde.
  river.var.summary: It flows into the Mediterranean Sea in south-eastern France.
  river.orne.summary: This river in Normandy flows through Caen before reaching its mouth at Ouistreham.
  river.allier.summary: The Allier flows directly into the Loire.
  river.cher.summary: The Cher flows directly into the Loire.
  river.oise.summary: The Oise joins the Seine at Conflans-Sainte-Honorine. The TOPAGE outline covers the available
    French section.
  river.lot.summary: The Lot flows directly into the Garonne.
  river.isere.summary: The Isère joins the Rhône north of Valence.
  river.ain.summary: The Ain descends from the Jura Mountains and flows directly into the Rhône.
  landforms.approximate_notice: 'Indicative landform area: the Natural Earth boundaries are approximate and
    have no administrative status.'
  landforms.schematic_notice: 'A schematic area drawn for this deck: it locates the broad landform region without
