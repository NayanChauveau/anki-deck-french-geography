explanations:
  landforms.morvan.context: 'In Burgundy, at the north-eastern end of the Massif Central, between the Seine,
    Loire and Saône basins.'
  landforms.chaine-des-puys.context: 'A volcanic chain north of the Monts Dore, west of Clermont-Ferrand
    and the Limagne plain.'
  landforms.monts-dore.context: 'A volcanic massif south-west of Clermont-Ferrand, whose highest point is
    the Puy de Sancy.'
  landforms.cantal.context: 'A volcanic massif around the Plomb du Cantal and Puy Mary, north-east of Aurillac.'
  landforms.forez.context: 'East of the Dore valley and west of the Forez plain, through which the Loire
    flows.'
  landforms.livradois.context: 'Between the Allier valley to the west and the Dore valley to the east; the
    Forez Mountains lie beyond the Dore.'
  landforms.millevaches.context: 'In the Limousin uplands, in the western Massif Central; the Vienne and
    Vézère rise here.'
  landforms.aubrac.context: 'A plateau in the southern Massif Central, between the Lot, Truyère and Colagne
    valleys.'
  landforms.cevennes.context: 'Along the south-eastern edge of the Massif Central, across Lozère, Gard and
    Ardèche.'
  landforms.lyonnais.context: 'West of Lyon and east of the Forez plain, with the Beaujolais to the north
    and the Pilat to the south.'
  landforms.beaujolais.context: 'North-west of Lyon, west of the Saône valley and north of the Lyonnais
    Mountains.'
  landforms.pilat.context: 'On the eastern edge of the Massif Central, south-east of Saint-Étienne and west
    of the Rhône.'
  landforms.vercors.context: 'A pre-Alpine massif south-west of Grenoble, between the Isère and Drôme valleys.'
  landforms.chartreuse.context: 'Between Grenoble to the south and Chambéry to the north, west of the Grésivaudan
    valley.'
  landforms.bauges.context: 'Between Chambéry, Annecy and Albertville, north-east of the Chartreuse.'
  landforms.bornes.context: 'East of Lake Annecy and west of the Aravis range. Here, the Bornes are shown
    separately from the Aravis.'
  landforms.aravis.context: 'A north-east–south-west range, east of the Bornes and west of the Val d’Arly.'
  landforms.chablais.context: 'Pre-Alps south of Lake Geneva, north of the Bornes and Aravis. Only the French
    part is shown.'
  landforms.beaufortain.context: 'East of Albertville, south of the Mont Blanc massif and north of the Tarentaise
    valley.'
  landforms.belledonne.context: 'East of Grenoble and the Grésivaudan, facing the Chartreuse and extending
    towards the Maurienne valley.'
  landforms.ecrins.context: 'A high mountain massif between the Romanche to the north, the Durance to the
    east and the Drac to the west.'
  landforms.queyras.context: 'Around the Guil basin, east of the Durance, close to the Italian border.'
  landforms.ventoux.context: 'A Provençal massif north-east of Carpentras and east of the Rhône corridor.'
  landforms.luberon.context: 'A range between the Calavon to the north and the Durance to the south, from
    Cavaillon towards Manosque.'
  landforms.alpilles.context: 'A small limestone range east of Arles, south of Saint-Rémy-de-Provence and
    north of the Crau plain.'
  landforms.sainte-victoire.context: 'A limestone range east of Aix-en-Provence, whose highest point is
    the Pic des Mouches.'
  landforms.sainte-baume.context: 'A limestone range east of Aubagne and north of Toulon, across Bouches-du-Rhône
    and Var.'
  landforms.maures.context: 'In Var, between Hyères and Fréjus, south of the Maures depression.'
  landforms.esterel.context: 'A massif of red volcanic rocks east of Fréjus and Saint-Raphaël, on the Mediterranean
    coast.'
  landforms.montagne-noire.context: 'The south-western end of the Massif Central, where Tarn meets Aude: a steep northern slope towards Revel and Mazamet, a gentler southern slope towards Carcassonne.'
  landforms.corbieres.context: 'A massif between the Aude valley, from Carcassonne to Narbonne, to the north and the Agly valley to the south, reaching the coastal lagoons.'
  landforms.cote-dor.context: 'A limestone escarpment overlooking the Saône plain, from Dijon past Nuits-Saint-Georges and Beaune to around Santenay. Not the Côte-d’Or department.'
  landforms.montagne-de-reims.context: 'A wooded plateau between Reims to the north and the Marne valley at Épernay to the south, overlooking the Champagne plain.'
  landforms.cote-des-blancs.context: 'A north–south escarpment south of Épernay, from Cramant and Avize to Vertus, on the edge of the Brie champenoise plateau.'
  landforms.collines-sous-vosgiennes.context: 'A strip of hills at the eastern foot of the Vosges, between the mountains and the Alsace plain; only the stretch from Marlenheim to Thann is shown.'
  landforms.dentelles-de-montmirail.context: 'A small limestone range north of Carpentras, between Gigondas, Beaumes-de-Venise and Malaucène, west of Mont Ventoux.'
  landforms.alberes.context: 'The eastern end of the Pyrenees, from the Col du Perthus to the Mediterranean between Collioure and Cerbère, along the Spanish border. Only the French part is shown.'
  landforms.larzac.context: 'A limestone plateau of the Grands Causses between Millau to the north and Lodève to the south, shared by Aveyron and Hérault.'
  landforms.revermont.context: 'The western edge of the Jura overlooking the Bresse plain, from the Seille near Lons-le-Saunier to the Ain river near Pont-d’Ain.'
  landforms.espinouse-caroux.context: 'Haut-Languedoc uplands north of the Jaur and Orb valleys, between Olargues, Lamalou-les-Bains and Saint-Gervais-sur-Mare.'
  landforms.clape.context: 'A massif between Narbonne and the Mediterranean, bounded by the Aude to the north and by Gruissan and its lagoons to the south.'
  landforms.maconnais.context: 'North–south ridges between the Grosne to the west and the Saône to the east, from Tournus to Mâcon, north of the Beaujolais.'
  river.loire.summary: It passes through Orléans, Tours and Nantes before reaching the Atlantic at Saint-Nazaire.
  river.seine.summary: It flows through Paris, then Rouen, before reaching the English Channel through the
    Seine estuary.
  river.rhone.summary: It flows through Lake Geneva and Lyon, then reaches the Mediterranean Sea through its
    delta in the Camargue.
  river.ariege.summary: It joins the Garonne south of Toulouse.
  river.dordogne.summary: It meets the Garonne at the Bec d’Ambès; their shared estuary is the Gironde.
  river.doubs.summary: A river in the Jura Mountains, it is a tributary of the Saône.
  river.durance.summary: A tributary of the Rhône, it drains part of the Southern Alps.
  river.escaut.summary: Rising in France, this river flows through Belgium before reaching the North Sea through
    the Netherlands.
  river.garonne.summary: The Garonne and the Dordogne meet to form the Gironde estuary.
  river.marne.summary: A tributary of the Seine, it joins that river near Paris.
  river.meuse.summary: This river flows through France, Belgium and the Netherlands.
  river.moselle.summary: It belongs to the Rhine basin and is a tributary of the Rhine.
  river.rhin.summary: The Rhine flows into the North Sea. The Natural Earth outline is supplemented by the
    available border section from BD TOPAGE 2024; it does not show the entire international course.
  river.saone.summary: The Saône joins the Rhône in Lyon. Its outline comes from BD TOPAGE 2024.
  river.segre.summary: It rises in French Cerdanya and joins the Ebro.
  river.tarn.summary: It rises on Mont Lozère and joins the Garonne.
  river.vienne.summary: It rises on the Plateau de Millevaches and joins the Loire.
  river.yonne.summary: Rising in the Morvan, it joins the Seine at Montereau-Fault-Yonne.
  river.adour.summary: It flows through Tarbes, Dax and Bayonne before reaching the Atlantic.
  river.somme.summary: It flows through Amiens and Abbeville, then reaches the English Channel. The outline
    includes the canalised Somme.
  river.vilaine.summary: It flows through Rennes and Redon before reaching its mouth, which is dammed at Arzal.
  river.charente.summary: It flows through Angoulême, Cognac, Saintes and Rochefort before reaching the Atlantic.
  river.aude.summary: It flows through Carcassonne and then reaches the Mediterranean Sea.
  river.herault.summary: It descends from Mont Aigoual and reaches the Mediterranean Sea near Agde.
  river.var.summary: It flows into the Mediterranean Sea in south-eastern France.
  river.orne.summary: This river in Normandy flows through Caen before reaching its mouth at Ouistreham.
  river.allier.summary: The Allier flows directly into the Loire.
  river.cher.summary: The Cher flows directly into the Loire.
  river.oise.summary: The Oise joins the Seine at Conflans-Sainte-Honorine. The TOPAGE outline covers the available
    French section.
  river.lot.summary: The Lot flows directly into the Garonne.
  river.isere.summary: The Isère joins the Rhône north of Valence.
  river.ain.summary: The Ain descends from the Jura Mountains and flows directly into the Rhône.
  river.layon.summary: 'It joins the Loire on its left bank at Chalonnes-sur-Loire, south-west of Angers.'
  river.aubance.summary: 'It passes Mûrs-Érigné and joins the Louet, an arm of the Loire, at Denée, south-west of Angers.'
  river.thouet.summary: 'It flows through Parthenay and Thouars, then joins the Loire at Saumur.'
  river.indre.summary: 'It flows through Châteauroux, Loches and Azay-le-Rideau, then joins the Loire at Avoine, near Chinon.'
  river.creuse.summary: 'Rising on the Plateau de Millevaches, it flows through Aubusson and Argenton-sur-Creuse, then joins the Vienne at Port-de-Piles.'
  river.loir.summary: 'It flows through Châteaudun, Vendôme and La Flèche, then joins the Sarthe at Briollay, north of Angers — not the Loire.'
  river.sarthe.summary: 'It flows through Alençon and Le Mans, then meets the Mayenne to form the Maine, just north of Angers.'
  river.sevre-nantaise.summary: 'It flows through Clisson and joins the Loire at Nantes, on the boundary with Rezé. Not to be confused with the Sèvre Niortaise.'
  river.maine-sevre-nantaise.summary: 'A tributary of the Sèvre Nantaise, it flows through Montaigu and joins it between Saint-Fiacre-sur-Maine and Vertou. Not the Maine of Angers.'
  river.gironde.summary: 'An estuary formed at the Bec d’Ambès by the Garonne and the Dordogne; it runs about 75 km to the Atlantic, between the Pointe de Grave and Royan.'
  river.ciron.summary: 'A left-bank tributary of the Garonne, it joins it at Barsac, upstream of Bordeaux.'
  river.isle.summary: 'Rising in Haute-Vienne, it flows through Périgueux and joins the Dordogne at Libourne.'
  river.dronne.summary: 'It flows through Brantôme and joins the Isle at Coutras.'
  river.ardeche.summary: 'Rising in the Massif Central, it passes through its gorges and joins the Rhône near Pont-Saint-Esprit.'
  river.drome.summary: 'It flows through Die and Crest, then joins the Rhône between Livron-sur-Drôme and Loriol-sur-Drôme.'
  river.ouveze.summary: 'It flows through Buis-les-Baronnies and Vaison-la-Romaine, then joins the Rhône at Sorgues. Another Ouvèze flows in Ardèche.'
  river.eygues.summary: 'Also called the Aigues or Aigue, it flows through Nyons and joins the Rhône at Caderousse, north-west of Orange.'
  river.ceze.summary: 'Rising in the Cévennes, it flows through Bagnols-sur-Cèze and joins the Rhône between Codolet and Laudun-l’Ardoise.'
  river.gardon.summary: 'Also called the Gard, it forms where the Gardons of Alès and Anduze meet, passes under the Pont du Gard and joins the Rhône upstream of Beaucaire.'
  river.doux.summary: 'A right-bank tributary of the Rhône, it joins it at Tournon-sur-Rhône.'
  river.argens.summary: 'It crosses the Var department from west to east and reaches the Mediterranean at Fréjus.'
  river.orb.summary: 'It flows through Bédarieux and Béziers, then reaches the Mediterranean at Valras-Plage.'
  river.agly.summary: 'It flows through Saint-Paul-de-Fenouillet and Estagel, then reaches the Mediterranean at Le Barcarès.'
  river.tet.summary: 'Rising near the Carlit, it flows through Prades and Perpignan, then reaches the Mediterranean at Canet-en-Roussillon.'
  river.tech.summary: 'It crosses the Vallespir, flows through Céret and reaches the Mediterranean north of Argelès-sur-Mer.'
  river.serein.summary: 'It flows through Chablis and joins the Yonne at Bonnard.'
  river.ouche.summary: 'It flows through Dijon and joins the Saône at Échenon, near Saint-Jean-de-Losne.'
  river.dheune.summary: 'It joins the Saône at Allerey-sur-Saône, just downstream of the Doubs confluence.'
  river.grosne.summary: 'It flows through Cluny and joins the Saône between Marnay and Ouroux-sur-Saône, south of Chalon-sur-Saône.'
  river.seille.summary: 'Rising at the foot of the Jura, it flows through Louhans and joins the Saône at La Truchère, near Tournus. Not the Seille of Lorraine.'
  river.loue.summary: 'Rising from a resurgence at Ouhans, it flows through Ornans and joins the Doubs at Parcey, south of Dole.'
  river.aube.summary: 'Rising on the Langres plateau, it flows through Bar-sur-Aube and joins the Seine at Marcilly-sur-Seine.'
  river.vesle.summary: 'It flows through Reims and joins the Aisne near Condé-sur-Aisne, upstream of Soissons.'
  river.aisne.summary: 'It flows through Soissons and joins the Oise at Clairoix, near Compiègne.'
  river.ill.summary: 'Rising in the Alsatian Jura, it flows through Mulhouse and Strasbourg, then joins the Rhine at Offendorf.'
